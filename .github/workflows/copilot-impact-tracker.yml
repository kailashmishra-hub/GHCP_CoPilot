name: Copilot Impact Tracker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Copilot is deliberately restricted to read-only repository access. The job is
# also disabled for forked PRs to reduce prompt-injection and secret exposure.
permissions:
  contents: read
  copilot-requests: write

jobs:
  analyze-and-test:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch PR base
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Run impact agent and selected scenarios
        id: impact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMPACT_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          mkdir -p runtime
          copilot --yolo --agent=impact-tracker --prompt \
            "Analyze this PR against ${IMPACT_BASE_REF}. Identify impacted scenarios, choose the smallest safe subset, run that subset with Maven, and print the required report." \
            2>&1 | tee runtime/copilot-impact-report.txt

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f runtime/copilot-impact-report.txt ]; then
            {
              echo "## Copilot impact tracker"
              echo '```text'
              cat runtime/copilot-impact-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload impact reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: copilot-impact-report-pr-${{ github.event.pull_request.number }}
          path: |
            runtime/*.txt
            target/cucumber-reports/**
            target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 14
